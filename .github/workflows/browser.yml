name: Browser

on: [push, pull_request]

jobs:
  browser:
    runs-on: ubuntu-latest

    # Backstop against a hang, not a performance target.
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Must stay 8.5 or newer: config.platform.php is pinned to 8.5.12.
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.5'
        extensions: bcmath, curl, dom, fileinfo, iconv, mbstring, pcntl, posix, simplexml, sqlite3, pdo_sqlite, xml, xmlwriter, zip
        coverage: none

    - name: Install PHP dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    # The suite drives the built bundle; without it every page mounts nothing
    # and the failures say nothing about why.
    - name: Build the frontend
      run: npm ci && npm run build

    - name: Install Chromium for Playwright
      run: npx playwright install --with-deps chromium

    - name: Prepare the environment
      run: |
        cp .env.example .env
        php artisan key:generate

    # pest-plugin-browser serves the application from the test process
    # itself, so the database is phpunit.xml's sqlite :memory: and nothing
    # needs serving or migrating here.
    - name: Browser tests
      run: vendor/bin/pest --testsuite=Browser

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: browser-failures
        path: tests/Browser/Screenshots
        if-no-files-found: ignore
