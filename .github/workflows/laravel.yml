name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.3'
        extensions: bcmath, curl, dom, fileinfo, iconv, mbstring, pcntl, posix, simplexml, sqlite3, pdo_sqlite, xml, xmlwriter, zip
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Check code style
      run: vendor/bin/pint --config=./pint.json --test

    # The database comes from phpunit.xml, which pins sqlite :memory: for the whole suite.
    - name: Execute tests (Unit and Feature tests) via Pest
      run: vendor/bin/pest

  frontend:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.3'
        coverage: none

    # resources/js/app.js imports Ziggy from vendor/tightenco/ziggy, so the build needs
    # the composer packages. Dev dependencies are not involved.
    - name: Install PHP dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --no-dev

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install node dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build (client + SSR)
      run: npm run build
