name: Dusk

on: [push, pull_request]

jobs:
  dusk:
    runs-on: ubuntu-latest

    # Backstop against a hang, not a performance target: composer, npm and the
    # build dominate the real cost of this job (a local run of every step here
    # takes well under this), and the "Serve" step below is bounded on its
    # own. This exists in case something later still finds a way to hang, so
    # that outcome is a failed job rather than GitHub's own 360 minute default.
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: monster_hunter_dusk
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Must stay 8.5 or newer. config.platform.php is pinned to 8.5.0, so
    # composer install succeeds on an older PHP and then every artisan call
    # dies in vendor/composer/platform_check.php, surfacing at key:generate,
    # nowhere near the cause.
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.5'
        coverage: none

    - name: Install PHP dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Build the frontend
      run: npm ci && npm run build

    - name: Prepare the environment
      run: |
        cp .env.dusk.ci .env
        php artisan key:generate
        php artisan migrate --force
        php artisan db:seed --force

    - name: Match chromedriver to the runner's Chrome
      run: php artisan dusk:chrome-driver --detect

    - name: Serve
      run: |
        php artisan serve --no-reload > /tmp/serve.log 2>&1 &

        # Bounded to 30s and fails loudly rather than looping forever. A
        # server that dies at boot (bad config, a missing extension, a fatal
        # error) would otherwise have curl --fail return non-zero forever,
        # spinning until the job's own timeout-minutes backstop cancels the
        # job, which is not a step failure, so the failure() artifact upload
        # below would never run: six hours for nothing and no screenshot,
        # for a failure this reports in 30s with the reason attached.
        if ! timeout 30 bash -c 'until curl --output /dev/null --silent --fail http://127.0.0.1:8000; do sleep 0.5; done'; then
          echo "::error::php artisan serve never answered on 127.0.0.1:8000 within 30s"
          cat /tmp/serve.log
          exit 1
        fi

    # No --env flag here: DuskCommand strips any --env= argument before
    # invoking phpunit (it is not a real option on this command), and its own
    # environment swap keys off APP_ENV via duskFile(), looking for
    # .env.dusk.{environment} and falling back to .env.dusk, neither of which
    # is .env.dusk.ci. That swap is harmless in CI because .env.dusk is
    # gitignored and absent on the runner, so it never fires; cp .env.dusk.ci
    # .env above is what actually selects the environment. A developer's own
    # machine is a different story: if a local .env.dusk exists, running this
    # same command there silently swaps it in over whatever .env holds.
    - name: Dusk
      run: php artisan dusk

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: dusk-failures
        path: |
          tests/Browser/screenshots
          tests/Browser/console
